# 57DMC (Juan David Arrieta Navarro) — SmartLink.
# Fuente de marca: 57Dmc/01_ADN_y_Memoria/01_brand_guidelines.md (ADN entregado por el cliente, 2026-09)
#   §2 paleta CONFIRMADA: dorado canónico #D19E03 + negro #000000 + blanco #FFFFFF.
#      Las 3 extendidas (#060D0E, #28251A, #967102) siguen ⏳ → no se usan aquí.
#      Los grises de muted/border son neutros de interfaz, no colores de marca.
#   §2 tipografía: AGITACIYA es comercial (no está en Google Fonts) → Staatliches, el
#      primer respaldo que declara el ADN. Cuerpo en Inter (el ADN no fija fuente de cuerpo).
#   §2 logo: wordmark oficial sobre negro, recortado al contenido → hero negro puro para
#      que el fondo del archivo se funda con la landing.
#   §1 mensajes de marketing aprobados → tagline.
#   §0/§5 WhatsApp +507 6910-3347 (confirmado por el cliente) y canales oficiales.
#
# Decisiones tomadas (es marca personal / ministerio, no negocio de producto):
#   · No hay catálogo ni precios → el desplegable es "Escucha mi música" con las
#     plataformas reales listadas en el ADN.
#   · No hay punto de venta → el equivalente de "ubicación" es invitaciones a eventos.
#   · ⏳ TikTok: el cliente lo declara como canal pero sin handle → no se pone botón.

id: 57dmc
folder: "57Dmc"
slug: 57dmc
enabled: true
name: "57DMC"
handle: "Exhorto · Consuelo · Edifico"
tagline: "Inspiro a crecer en Cristo con Música Bíblica."
description: "Música Bíblica de 57DMC (Juan Arrieta): rap cristiano para edificar, exhortar y consolar a la iglesia de Cristo. Escucha, apoya el ministerio o invítalo a tu evento."

logo:
  src: "57Dmc/01_ADN_y_Memoria/Assets_Visuales_Base/logo-57dmc.png"
  alt: "Logo 57DMC"
  style: bare          # wordmark sobre negro opaco → se funde con el hero negro puro
  replacesName: true   # el logo ya dice "57DMC" — el <h1> no se repite en pantalla
  maxHeight: 132

monogram: "57"

theme:
  mode: dark
  bg: "#000000"          # negro, fondo dominante (§2)
  bgAlt: "#0A0A0A"
  hero: "#000000"        # igual al fondo del archivo del logo
  onHero: "#FFFFFF"
  surface: "#111111"
  text: "#FFFFFF"        # blanco, texto de cuerpo (§2)
  muted: "#A3A3A3"
  border: "#2A2A2A"
  primary: "#D19E03"     # dorado canónico (§2)
  onPrimary: "#000000"
  accent: "#D19E03"
  onAccent: "#000000"
  accentOutline: "#D19E03"
  radius: 12
  fonts:
    display: "Staatliches"
    body: "Inter"
    displayUppercase: true
    displayTracking: "0.03em"
    google: ["Staatliches", "Inter:wght@400;500;600"]

buttons:
  - kind: menu
    label: "Escucha mi música"
    note: "Spotify, YouTube, Apple Music, Deezer"
    icon: music
    variant: accent
    items:
      - { label: "Spotify", href: "https://open.spotify.com/artist/1vV083YQ6jtLGRQc8VjenD" }
      - { label: "YouTube", href: "https://youtube.com/@57DMC" }
      - { label: "Apple Music", href: "https://itunes.apple.com/pa/artist/57dmc/1400685047" }
      - { label: "Deezer", href: "https://www.deezer.com/es/artist/14913559" }

  - kind: link
    label: "Videos en YouTube"
    note: "Sencillos, raps directos y reflexiones"
    icon: video
    href: "https://youtube.com/@57DMC"

  - kind: link
    label: "Apoya el ministerio"
    note: "Donación por PayPal"
    icon: heart
    href: "https://www.paypal.com/paypalme/juanarrieta57dmc"

  - kind: link
    label: "Invitaciones a eventos"
    note: "Iglesias, conciertos y ministerio"
    icon: whatsapp
    href: "https://wa.me/50769103347?text=Hola%2057DMC%2C%20quiero%20invitarte%20a%20un%20evento/ministerio."

social:
  - { network: instagram, url: "https://instagram.com/57dmc", label: "Instagram" }
  - { network: youtube, url: "https://youtube.com/@57DMC", label: "YouTube" }
  - { network: spotify, url: "https://open.spotify.com/artist/1vV083YQ6jtLGRQc8VjenD", label: "Spotify" }
  - { network: facebook, url: "https://facebook.com/57DMC", label: "Facebook" }
  - { network: mail, url: "mailto:equipo57dmc@gmail.com", label: "Correo" }

footer:
  note: "Panamá · Música Bíblica desde 2012"
  credit: true
