name: SmartLinks · publicar landings

# Genera las landings de enlaces de cada cliente (smartlinks/clients/*.yml) y las
# publica en GitHub Pages. El Source de Pages ya está en "GitHub Actions".
#
# ── Pages hospeda, juancitoads.com da la cara ──────────────────────
# El HTML vive en GitHub Pages, pero el link que se pega en la bio de Instagram
# es `https://juancitoads.com/<slug>`: el sitio de Netlify lo sirve por proxy
# desde `PAGINA-JUANCITO-ADS/public/_redirects`. De ahí que aquí haya dos URLs
# distintas y no una:
#
#   SMARTLINKS_BASE_URL   la que ve el visitante → canonical y og:url.
#   SMARTLINKS_PAGES_URL  el origen real en Pages → solo para escribir el bloque
#                         de proxy que hay que pegar en el repo de la web.
#
# Los links de cada cliente quedan en el RESUMEN del run (pestaña Actions → run →
# Summary), junto con ese bloque ya generado.

on:
  push:
    branches: [main]
    paths:
      - "smartlinks/**"
      - ".github/workflows/smartlinks.yml"
      - "package.json"
      - "package-lock.json"
      - "*/01_ADN_y_Memoria/Assets_Visuales_Base/**"   # logos de los clientes
  workflow_dispatch:
    inputs:
      deploy:
        description: "Publicar en GitHub Pages (desmarcado = solo generar y revisar el resumen)"
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: smartlinks-pages
  cancel-in-progress: true

jobs:
  build:
    name: Generar landings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Configurar GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Generar SmartLinks
        env:
          # El dominio de la agencia se escribe aquí y solo aquí. Si algún día
          # cambia, cambia en esta línea y en el bloque de `_redirects` del repo
          # de la web — no hay ninguna otra copia.
          SMARTLINKS_BASE_URL: https://juancitoads.com
          SMARTLINKS_PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: npm run --silent smartlinks

      - name: Subir artefacto de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/smartlinks

  deploy:
    name: Publicar en Pages
    needs: build
    if: github.event_name != 'workflow_dispatch' || inputs.deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Enlaces publicados
        run: |
          {
            echo "## ✅ SmartLinks en vivo"
            echo ""
            echo "Hub interno (solo Pages, \`noindex\`): ${{ steps.deployment.outputs.page_url }}"
            echo ""
            echo "Los links públicos de cada cliente (\`juancitoads.com/<slug>\`) están en el"
            echo "resumen del job **Generar landings**, junto con las reglas de Netlify."
          } >> "$GITHUB_STEP_SUMMARY"
